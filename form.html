<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W05 Assignment: Product Review Form</title>
    <meta name="description" content="Submit a product review by rating your experience, sharing useful features, and providing feedback.">
    <meta name="author" content="Christian Sandoya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <div>
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a product...</option>
            </select>
            </div>
            <div>
                <p>Overall Rating</p>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">✰</label>
                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">✰✰</label>
                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">✰✰✰</label>
                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">✰✰✰✰</label>
                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">✰✰✰✰✰</label>
            </div>
            <div>
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
            </div>
            <div>
                <p>Useful Features</p>
                <input type="checkbox" id="durable" name="features" value="durable">
                <label for="durable">Durable</label>
                <input type="checkbox" id="easyToUse" name="features" value="easyToUse">
                <label for="easyToUse">Easy to Use</label>
                <input type="checkbox" id="performance" name="features" value="performance">
                <label for="performance">Performance</label>
                <input type="checkbox" id="design" name="features" value="design">
                <label for="design">Design</label>
            </div>
            <div>
                <label for="review">Written Review</label>
                <textarea id="review" name="review"></textarea>
            </div>
            <div>
                <label for="username">User Name</label>
                <input type="text" id="username" name="username">
            </div>
            <input type="submit" value="Submit Review">
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> | Christian Sandoya | Peru</p>
        <p class="last-modified">Last Modified: <span id="lastModified"></span></p>
    </footer>
    
</body>
</html>
